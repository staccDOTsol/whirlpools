<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cash out a seat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#0f1214;color:#e9edf0;font-family:"IBM Plex Sans",system-ui,sans-serif}
a{color:#6fd4a3}a:hover{color:#9be8c2}
@keyframes pop{0%{transform:scale(.94);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:scale(1)}}
</style>
</helmet>
<div style="width: 480px; height: 600px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px; background: #12161a; border: 1px solid #22282c; border-radius: 18px; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #e9edf0">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.01em">Cash out #12</span>
    <a href="Main.dc.html" aria-label="Close" style="width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; background: #1c2226; color: #e9edf0; text-decoration: none">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg>
    </a>
  </div>

  <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; flex-grow: 1; padding: 28px; border-radius: 14px; background: #14261c; border: 1px solid #2fd27a; animation: pop .35s ease-out">
      <svg width="48" height="48" viewBox="0 0 16 16" fill="none" stroke="#2fd27a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l3 3 7-7"/></svg>
      <span style="font-family: Archivo, sans-serif; font-weight: 800; font-size: 26px">1.42 SOL in your wallet</span>
      <span style="font-size: 14px; color: #93a0a8">Seat NFT burned · 14.9M CNN back to the reserve</span>
    </div>
  </sc-if>

  <sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 24px 16px 18px; border-radius: 14px; background: #0f1214">
      <span style="font-size: 12px; color: #93a0a8; text-transform: uppercase; letter-spacing: 0.08em">You get</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 64px; font-weight: 500; line-height: 1; letter-spacing: -0.03em">1.42</span>
      <span style="font-size: 15px; color: #93a0a8">SOL</span>
      <span style="font-family: Archivo, sans-serif; font-weight: 800; font-size: 30px; color: #2fd27a; line-height: 1.2">+42%</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #93a0a8">put in 1.00 · 3h 10m ago · 0.31 of it is fees</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid #22282c; font-size: 13px">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2fd27a" stroke-width="2" stroke-linecap="round"><path d="M3 8l3 3 7-7"/></svg>
        <span>Old enough</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid #22282c; font-size: 13px">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2fd27a" stroke-width="2" stroke-linecap="round"><path d="M3 8l3 3 7-7"/></svg>
        <span>Room now · resets <span style="font-family: 'IBM Plex Mono', monospace">0:41</span></span>
      </div>
    </div>

    <div style="flex-grow: 1"></div>
    <button onClick="{{confirm}}" style="height: 60px; border-radius: 14px; border: 0; background: {{btnBg}}; color: #0f1214; font: inherit; font-family: Archivo, sans-serif; font-weight: 800; font-size: 18px; cursor: pointer">{{btnLabel}}</button>
    <div style="font-size: 12px; color: #93a0a8; text-align: center">{{hint}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":600}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { armed: false, done: false }; }
  renderVals() {
    const armed = this.state.armed;
    return {
      done: this.state.done, notDone: !this.state.done,
      confirm: () => armed ? this.setState({ done: true }) : this.setState({ armed: true }),
      btnLabel: armed ? 'Tap again · 1.42 SOL' : 'Cash out 1.42 SOL',
      btnBg: armed ? '#f7c6c6' : '#f0a0a0',
      hint: armed ? 'Second tap is final. Burns the seat.' : 'Unsold seed goes back to the reserve. Fees are yours.',
    };
  }
}
</script>
</body>
</html>
