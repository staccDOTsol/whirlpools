<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launches, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#0f1214;color:#e9edf0;font-family:"IBM Plex Sans",system-ui,sans-serif}
a{color:#e9edf0}a:hover{color:#ffffff}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0f1214; display: flex; flex-direction: column; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #e9edf0">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 16px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 26px; height: 26px; border-radius: 7px; background: #2fd27a; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#0f1214" stroke-width="2" stroke-linecap="round"><path d="M3 12h3V8M7 12h3V5M11 12h3V2"/></svg>
      </div>
      <span style="font-family: Archivo, sans-serif; font-weight: 800; font-size: 16px">Ladder</span>
      <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: #93a0a8"><span style="width: 7px; height: 7px; border-radius: 4px; background: #2fd27a; animation: blink 1.2s infinite"></span>412 seats/h</span>
    </div>
    <button style="height: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: #1c2226; color: #e9edf0; font: inherit; font-size: 13px; font-weight: 500">Connect</button>
  </div>

  <div style="display: flex; gap: 8px; padding: 4px 16px 12px">
    <button onClick="{{tabHot}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: {{hotBg}}; color: {{hotFg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 16 16" fill="#ff8a3d" aria-hidden="true"><path d="M8 1c1 3 4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-4 0-7z"/></svg>Hot</button>
    <button onClick="{{tabNew}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: {{newBg}}; color: {{newFg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">New</button>
    <button onClick="{{tabMine}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: {{mineBg}}; color: {{mineFg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Mine</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px; flex-grow: 1; overflow: hidden">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="5">
      <a href="Phone.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 10px; border-radius: 14px; background: #12161a; border: 1px solid {{row.border}}; text-decoration: none; box-sizing: border-box">
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="width: 40px; height: 40px; border-radius: 10px; background: #1c2226; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #93a0a8; flex: none">{{row.symbol}}</div>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.name}}</span>
              <sc-if value="{{row.hot}}" hint-placeholder-val="{{true}}"><span style="font-size: 10px; font-weight: 800; font-family: Archivo, sans-serif; color: #ff8a3d; padding: 2px 6px; border-radius: 5px; background: #2a1a10">HOT</span></sc-if>
            </div>
            <span style="font-size: 12px; color: #93a0a8">{{row.mcap}} · {{row.rate}}</span>
          </div>
          <span style="font-family: Archivo, sans-serif; font-weight: 800; font-size: 24px; color: {{row.changeColor}}; flex: none; letter-spacing: -0.02em">{{row.change}}</span>
        </div>
        <div style="height: 4px; border-radius: 2px; background: #1c2226; overflow: hidden"><div style="width: {{row.heat}}; height: 4px; border-radius: 2px; background: {{row.heatColor}}"></div></div>
      </a>
    </sc-for>
  </div>

  <div style="padding: 12px 16px 24px; border-top: 1px solid #22282c; background: #0f1214">
    <a href="PhoneCreate.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #2fd27a; color: #0f1214; text-decoration: none; font-family: Archivo, sans-serif; font-weight: 800; font-size: 16px">Launch a token</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'hot' }; }
  renderVals() {
    const t = this.state.tab;
    const on = '#1c2226', off = 'transparent', onFg = '#e9edf0', offFg = '#93a0a8';
    const G = '#2fd27a', R = '#f0a0a0', M = '#93a0a8', O = '#ff8a3d';
    const all = [
      { symbol: 'CNN', name: 'Breaking', mcap: '$48.6k', rate: '14 seats/min', change: '+31%', changeColor: G, heat: '78%', heatColor: O, hot: true, border: '#3a2414', fresh: true, mine: true },
      { symbol: 'GTA', name: 'GTA IV', mcap: '$128k', rate: '6 seats/min', change: '+2%', changeColor: G, heat: '40%', heatColor: O, hot: true, border: '#22282c', fresh: false, mine: false },
      { symbol: 'DERP', name: 'Derp', mcap: '$11.9k', rate: 'opened 2m ago', change: '0%', changeColor: M, heat: '12%', heatColor: M, hot: false, border: '#22282c', fresh: true, mine: false },
      { symbol: 'SAUC', name: 'Sauce', mcap: '$62k', rate: '3 seats/min', change: '+8%', changeColor: G, heat: '22%', heatColor: O, hot: false, border: '#22282c', fresh: false, mine: false },
      { symbol: 'PILL', name: 'Pills', mcap: '$36k', rate: 'USDC · quiet', change: '−12%', changeColor: R, heat: '5%', heatColor: M, hot: false, border: '#22282c', fresh: false, mine: true },
    ];
    const rows = t === 'hot' ? all : t === 'new' ? all.filter(r => r.fresh) : all.filter(r => r.mine);
    return {
      rows,
      tabHot: () => this.setState({ tab: 'hot' }), tabNew: () => this.setState({ tab: 'new' }), tabMine: () => this.setState({ tab: 'mine' }),
      hotBg: t === 'hot' ? on : off, hotFg: t === 'hot' ? onFg : offFg,
      newBg: t === 'new' ? on : off, newFg: t === 'new' ? onFg : offFg,
      mineBg: t === 'mine' ? on : off, mineFg: t === 'mine' ? onFg : offFg,
    };
  }
}
</script>
</body>
</html>
